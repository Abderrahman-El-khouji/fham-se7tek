<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فهم صحتك — شرح المعلومة الصحية بوضوح</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --green-deep:#1F4A3F;
    --green:#2F6B57;
    --green-soft:#DCE9E1;
    --cream:#FAF6EE;
    --cream-warm:#F2EADC;
    --coral:#E2795F;
    --coral-soft:#F3C9B8;
    --ink:#22312B;
    --muted:#63736B;
    --line: rgba(34,49,43,0.09);
    --radius: 20px;
    --shadow: 0 10px 30px rgba(31,74,63,0.08);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand{
    font-family:'Cairo', sans-serif;
  }
  a{color:inherit; text-decoration:none;}
  img{max-width:100%; display:block;}
  :focus-visible{outline:3px solid var(--coral); outline-offset:3px; border-radius:6px;}

  .wrap{max-width:1120px; margin:0 auto; padding:0 24px;}

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:rgba(250,246,238,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  header .wrap{
    display:flex; align-items:center; justify-content:space-between;
    padding-top:14px; padding-bottom:14px;
  }
  .brand-mini{display:flex; align-items:center; gap:10px;}
  .brand-mini img{height:34px; width:auto;}
  nav{display:flex; align-items:center; gap:28px;}
  nav a{font-weight:700; font-size:15px; color:var(--green-deep); opacity:.85; transition:opacity .2s;}
  nav a:hover{opacity:1;}

  /* ---------- hero ---------- */
  .hero{position:relative; overflow:hidden; padding:72px 0 76px;}
  .hero-blob{position:absolute; z-index:0; filter:blur(60px); opacity:.55; pointer-events:none;}
  .hero-blob.b1{ width:420px; height:420px; background:radial-gradient(circle at 30% 30%, var(--coral-soft), transparent 70%); top:-140px; left:-120px;}
  .hero-blob.b2{ width:460px; height:460px; background:radial-gradient(circle at 70% 70%, var(--green-soft), transparent 70%); bottom:-180px; right:-140px;}
  .hero-inner{position:relative; z-index:1; text-align:center; max-width:740px; margin:0 auto;}
  .hero-logo{margin:0 auto 22px; max-width:300px;}
  .eyebrow-tag{
    display:inline-block; font-size:13px; font-weight:700; color:var(--green);
    background:var(--green-soft); padding:6px 16px; border-radius:100px; margin-bottom:22px;
  }
  h1{font-size:clamp(26px, 4vw, 40px); font-weight:800; line-height:1.4; color:var(--ink); margin:0 0 18px;}
  h1 .accent{color:var(--coral);}
  .hero-sub{font-size:16.5px; color:var(--muted); max-width:600px; margin:0 auto 34px;}
  .hero-links{display:flex; align-items:center; justify-content:center; gap:22px; flex-wrap:wrap;}
  .btn-primary{
    background:var(--coral); color:#fff; font-family:'Cairo',sans-serif; font-weight:700;
    font-size:15px; padding:15px 32px; border-radius:13px; border:none; cursor:pointer;
    box-shadow:0 8px 20px rgba(226,121,95,0.3); transition:transform .2s, box-shadow .2s;
  }
  .btn-primary:hover{transform:translateY(-2px); box-shadow:0 12px 24px rgba(226,121,95,0.38);}
  .link-quiet{font-size:14px; font-weight:700; color:var(--green-deep); border-bottom:2px solid var(--coral-soft); padding-bottom:2px;}
  .link-quiet:hover{border-color:var(--coral);}

  /* ---------- section heading ---------- */
  .section-head{text-align:center; max-width:600px; margin:0 auto 40px;}
  .eyebrow-small{display:block; font-size:13px; font-weight:700; color:var(--coral); margin-bottom:10px; letter-spacing:.3px;}
  .section-head h2{font-size:clamp(22px,3vw,30px); font-weight:800; margin:0 0 10px;}
  .section-head p{color:var(--muted); font-size:15.5px; margin:0;}

  section{padding:60px 0;}

  /* ---------- problem / mission ---------- */
  .problem-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:28px;}
  .problem-card{
    background:#fff; border:1px solid var(--line); border-radius:18px; padding:26px 24px;
    text-align:right;
  }
  .problem-card .num{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:10px; background:var(--cream-warm);
    color:var(--coral); font-family:'Cairo',sans-serif; font-weight:800; font-size:15px; margin-bottom:14px;
  }
  .problem-card h3{font-size:16.5px; font-weight:700; margin:0 0 8px;}
  .problem-card p{font-size:14.5px; color:var(--muted); margin:0;}
  .solution-bar{
    background:var(--green-deep); color:#fff; border-radius:18px; padding:28px 34px;
    text-align:center; font-size:16px; font-weight:500; line-height:1.9;
  }
  .solution-bar b{font-family:'Cairo',sans-serif; font-weight:800; color:var(--coral-soft);}

  /* ---------- categories ---------- */
  .cat-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:20px;}
  .cat-card{
    background:#fff; border:1px solid var(--line); border-radius:var(--radius);
    padding:28px 22px; text-align:right; transition:transform .25s, box-shadow .25s, border-color .25s;
    display:flex; flex-direction:column; gap:12px;
  }
  .cat-card:hover{transform:translateY(-5px); box-shadow:var(--shadow); border-color:transparent;}
  .cat-icon{width:48px; height:48px; border-radius:13px; display:flex; align-items:center; justify-content:center; background:var(--green-soft);}
  .cat-icon svg{width:24px; height:24px; stroke:var(--green-deep); fill:none;}
  .cat-card:nth-child(even) .cat-icon{background:var(--coral-soft);}
  .cat-card:nth-child(even) .cat-icon svg{stroke:#b1502f;}
  .cat-card h3{font-size:16.5px; font-weight:700; margin:0;}
  .cat-card p{font-size:14px; color:var(--muted); margin:0; flex:1;}
  .cat-arrow{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; font-weight:700; color:var(--green-deep);}
  .cat-arrow svg{width:15px; height:15px; transform:scaleX(-1);}

  /* ---------- start-here banner ---------- */
  .start-banner{
    background:#fff; border:1px solid var(--line); border-radius:24px;
    padding:34px 40px; display:flex; align-items:center; justify-content:space-between; gap:24px; flex-wrap:wrap;
  }
  .start-banner h3{font-size:20px; font-weight:800; margin:0 0 6px;}
  .start-banner p{margin:0; color:var(--muted); font-size:15px;}
  .btn-outline{
    background:var(--green-soft); color:var(--green-deep); font-family:'Cairo',sans-serif; font-weight:700;
    font-size:15px; padding:13px 26px; border-radius:12px; border:none; cursor:pointer; white-space:nowrap;
    transition:background .2s;
  }
  .btn-outline:hover{background:#cfe2d8;}

  /* ---------- quote / core value ---------- */
  .quote-section{
    background:var(--green-deep); border-radius:28px; padding:56px 40px; text-align:center; color:#fff;
    position:relative; overflow:hidden;
  }
  .quote-section::before{content:""; position:absolute; inset:0; background:radial-gradient(circle at 20% 20%, rgba(226,121,95,0.18), transparent 55%);}
  .quote-mark{font-family:'Cairo',sans-serif; font-size:54px; color:var(--coral); line-height:1; margin-bottom:6px; position:relative;}
  .quote-section h3{font-size:clamp(20px,3vw,28px); font-weight:800; max-width:640px; margin:0 auto 16px; position:relative;}
  .quote-section p{max-width:560px; margin:0 auto; color:rgba(255,255,255,0.75); font-size:15px; position:relative;}

  /* ---------- disclaimer ---------- */
  .disclaimer{
    display:flex; align-items:center; gap:12px; justify-content:center;
    background:var(--cream-warm); border:1px solid var(--line); border-radius:14px;
    padding:16px 22px; font-size:14px; color:var(--muted); text-align:center;
  }
  .disclaimer svg{width:20px; height:20px; stroke:var(--green); flex-shrink:0;}

  /* ---------- founder ---------- */
  .founder-card{
    background:#fff; border:1px solid var(--line); border-radius:24px;
    padding:40px 44px; display:flex; align-items:center; justify-content:space-between; gap:32px; flex-wrap:wrap;
  }
  .founder-info{max-width:560px;}
  .founder-eyebrow{display:block; font-size:13px; font-weight:700; color:var(--coral); margin-bottom:10px;}
  .founder-card h3{font-size:20px; font-weight:800; margin:0 0 4px;}
  .founder-role{font-size:14px; color:var(--muted); margin:0 0 14px;}
  .founder-card p{font-size:14.5px; color:var(--muted); margin:0;}
  .founder-contacts{display:flex; gap:12px; flex-wrap:wrap;}
  .contact-pill{
    display:inline-flex; align-items:center; gap:8px; background:var(--green-soft); color:var(--green-deep);
    padding:11px 18px; border-radius:100px; font-size:14px; font-weight:700; white-space:nowrap;
    transition:background .2s;
  }
  .contact-pill:hover{background:#cfe2d8;}
  .contact-pill svg{width:16px; height:16px;}

  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line); padding:44px 0 30px;}
  .footer-top{display:flex; align-items:flex-start; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom:30px;}
  .footer-links{display:flex; gap:26px; flex-wrap:wrap;}
  .footer-links a{font-size:14.5px; font-weight:700; color:var(--green-deep); opacity:.85;}
  .footer-links a:hover{opacity:1;}
  .footer-bottom{border-top:1px solid var(--line); padding-top:20px; text-align:center; color:var(--muted); font-size:13.5px;}
  .footer-brand img{height:30px; margin-bottom:6px;}

  /* ---------- responsive ---------- */
  @media (max-width: 900px){
    .cat-grid{grid-template-columns:repeat(2,1fr);}
    .problem-grid{grid-template-columns:1fr;}
    nav{display:none;}
  }
  @media (max-width: 560px){
    .cat-grid{grid-template-columns:1fr;}
    .hero{padding:52px 0 56px;}
    section{padding:44px 0;}
    .start-banner{flex-direction:column; align-items:flex-start; text-align:right;}
    .footer-top{flex-direction:column;}
    .founder-card{flex-direction:column; align-items:flex-start; text-align:right; padding:32px 26px;}
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{transition:none !important; animation:none !important;}
  }
</style>
</head>
